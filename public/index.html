<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>PID Radar – živá mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="map" aria-label="Mapa vozidel PID"></div>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="logo-dot"></span>RADAR</div>
      <div class="brand-copy"><h1>PID Radar</h1><span>Praha · Středočeský kraj</span></div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" type="search" autocomplete="off" placeholder="Linka, evidenční číslo…" aria-label="Hledat linku nebo vozidlo">
      <button id="clearSearch" class="clear-search" title="Vymazat hledání" aria-label="Vymazat hledání">×</button>
    </div>
    <div class="actions">
      <select id="filter" aria-label="Filtrovat vozidla">
        <option value="all">Všechna vozidla</option>
        <option value="100-299">Praha · 100–299</option>
        <option value="300-899">Region · 300–899</option>
        <option value="900-999">Noční · 900–999</option>
      </select>
      <button id="locate" class="icon-button" title="Moje poloha">◎ <span>Moje poloha</span></button>
      <button id="refresh" class="icon-button" title="Obnovit data">↻ <span>Obnovit</span></button>
    </div>
  </header>

  <aside id="panel">
    <div class="panel-heading"><div><span class="eyebrow">AKTUÁLNÍ PROVOZ</span><h2>Přehled vozidel</h2></div><span id="liveBadge" class="live-badge"><i></i> LIVE</span></div>
    <div class="stats">
      <div class="stat-card"><span class="stat-icon">◉</span><b id="count">—</b><span>zobrazených</span></div>
      <div class="stat-card"><span class="stat-icon fresh-icon">↻</span><b id="fresh">—</b><span>aktuálních</span></div>
    </div>
    <div class="status-line"><span id="statusDot" class="status-dot"></span><span id="status">Připojuji živá data…</span></div>
    <div class="panel-foot delay-legend"><span class="legend-dot delay-green"></span>0–1 min <span class="legend-dot delay-yellow"></span>2–5 min <span class="legend-dot delay-red"></span>6+ min</div>
    <p class="hint">Data se obnovují automaticky. Vozidla mohou na mapě zůstat až 10 minut od posledního zachycení.</p>
    <button id="zoomHome" class="wide-button">⌖ Přehled celé oblasti</button>
  </aside>

  <div class="map-credit">Data: PID Open Data · Mapa © OpenStreetMap</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
